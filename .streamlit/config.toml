[theme]
base = "dark"
primaryColor = "#52687A"
backgroundColor = "#0D1420"
secondaryBackgroundColor = "#202734"
textColor = "#F2F3F1"
font = "sans serif"
linkColor = "#BCCAD5"
borderColor = "#465364"
dataframeBorderColor = "#465364"
dataframeHeaderBackgroundColor = "#283342"
dataframeHeaderTextColor = "#F2F3F1"
codeBackgroundColor = "#202734"
codeTextColor = "#F2F3F1"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
